# Quarkus HTTP
quarkus.http.port=8080

# Logs
quarkus.log.level=INFO
quarkus.log.category."org.apache.camel".level=INFO

# Datasource (Postgres)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=app
quarkus.datasource.password=app
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/camel_outbox

quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true

# Camel
camel.main.name=camel-outbox-playground

# Kafka bootstrap
app.kafka.bootstrap=localhost:9092

# Inbound/outbound topics (fase 0: solo placeholders)
app.topic.in=events.in
app.topic.invalid=events.invalid
app.topic.out=events.out
app.topic.dlq=events.dlq

# Perfil: redpanda
# Ejecuta con: ./gradlew quarkusDev -Dquarkus.profile=redpanda
%redpanda.app.kafka.bootstrap=localhost:9094

# Health
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=/q/health/live
quarkus.smallrye-health.readiness-path=/q/health/ready

# OpenTelemetry
quarkus.otel.sdk.disabled=true

quarkus.kafka.devservices.enabled=false