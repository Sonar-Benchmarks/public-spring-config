quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-internal-metrics-token

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${K8FLOW_DB_URL:jdbc:postgresql://localhost:5432/k8flow}
quarkus.datasource.username=${K8FLOW_DB_USER:k8flow}
quarkus.datasource.password=${K8FLOW_DB_PASSWORD:secret}

quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true

k8flow.build.namespace=${K8FLOW_BUILD_NAMESPACE:k8flow-system}
k8flow.build.default-image=${K8FLOW_BUILD_IMAGE:gcr.io/kaniko-project/executor:v1.23.2}
k8flow.build.cpu-limit=${K8FLOW_BUILD_CPU_LIMIT:1}
k8flow.build.memory-limit=${K8FLOW_BUILD_MEMORY_LIMIT:2Gi}
k8flow.build.registry=${K8FLOW_BUILD_REGISTRY:ghcr.io}
k8flow.build.timeout-seconds=${K8FLOW_BUILD_TIMEOUT_SECONDS:900}
k8flow.build.poll-interval-ms=${K8FLOW_BUILD_POLL_INTERVAL_MS:3000}
k8flow.dashboard.cache-ttl-seconds=${K8FLOW_DASHBOARD_CACHE_TTL_SECONDS:20}
k8flow.dashboard.cache-hit-ratio-threshold=${K8FLOW_DASHBOARD_CACHE_HIT_RATIO_THRESHOLD:0.60}
k8flow.internal.metrics-token=${K8FLOW_INTERNAL_METRICS_TOKEN:}
