quarkus.http.port=${PORT:8083}

quarkus.rest-client.patient-api.url=https://medicalrecord-service-mm.app.cloud.cbh.kth.se
quarkus.rest-client.encounter-api.url=https://medicalrecord-service-mm.app.cloud.cbh.kth.se

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,https://hospital-frontend-mm.app.cloud.cbh.kth.se
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type
quarkus.http.cors.access-control-allow-credentials=true


quarkus.oidc.auth-server-url=https://keycloak-mm.app.cloud.cbh.kth.se/realms/journal-system
quarkus.oidc.client-id=journal-frontend
quarkus.oidc.application-type=service

quarkus.http.auth.permission.search.paths=/search/*
quarkus.http.auth.permission.search.policy=authenticated
