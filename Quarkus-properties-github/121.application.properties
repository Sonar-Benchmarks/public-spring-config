quarkus.dynamodb.endpoint-override=http://localhost:4566
quarkus.dynamodb.aws.region=us-east-1
quarkus.dynamodb.aws.credentials.type=static
quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test

quarkus.application.name=release-manager
quarkus.http.port=${PORT:8080}

quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000,http://localhost:8080
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept,Origin,X-Requested-With
quarkus.http.cors.exposed-headers=Location

quarkus.mailer.mock=true
quarkus.mailer.from=jean.cortes.ortiz@gmail.com

quarkus.rest-client.compliance-client.url=http://localhost:8081
quarkus.rest-client.notification-client.url=http://localhost:8082
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=1024

quarkus.jackson.accept-case-insensitive-enums=true

%docker.quarkus.dynamodb.endpoint-override=http://localstack:4566
%docker.quarkus.rest-client.compliance-client.url=http://compliance:8081
%docker.quarkus.rest-client.notification-client.url=http://notifications:8082
