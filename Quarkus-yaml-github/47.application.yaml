zerodha:
  kite:
    mode:
      debug: false

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp:
  messaging:
    connector: smallrye-kafka
    outgoing:
      marketHistoricalDataRequest:
        enabled: ${MARKET_HISTORICAL_DATA_REQUEST_PRODUCER_ENABLED:true}
        connector: smallrye-kafka
        topic: ${MARKET_HISTORICAL_DATA_REQUEST_TOPIC:market-service.market-historical-data-request}
        value:
          serializer: io.quarkus.kafka.client.serialization.ObjectMapperSerializer
      basketHistoricalDataRequest:
        enabled: ${BASKET_HISTORICAL_DATA_REQUEST_PRODUCER_ENABLED:true}
        connector: smallrye-kafka
        topic: ${BASKET_HISTORICAL_DATA_REQUEST_TOPIC:market-service.basket-historical-data-request}
        value:
          serializer: io.quarkus.kafka.client.serialization.ObjectMapperSerializer
    incoming:
      marketHistoricalDataRequest-in:
        enabled: ${MARKET_HISTORICAL_DATA_REQUEST_CONSUMER_ENABLED:false}
        connector: smallrye-kafka
        broadcast: true
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: dead-letter.market-service.${MARKET_HISTORICAL_DATA_REQUEST_TOPIC:market-historical-data-request}
          value:
            serializer: io.quarkus.kafka.client.serialization.ObjectMapperSerializer
        topic: ${MARKET_HISTORICAL_DATA_REQUEST_TOPIC:market-service.market-historical-data-request}
        group:
          id: ${MARKET_HISTORICAL_DATA_REQUEST_GROUP_ID:market-historical-data-request}
        health-enabled: false
        enable:
          auto:
            commit: true
        auto:
          offset:
            reset: ${KAFKA_HISTORICAL_MARKET_DATA_REQUEST_OFFSET_RESET:earliest}
        value:
          serializer: io.quarkus.kafka.client.serialization.ObjectMapperSerializer
      basketHistoricalDataRequest-in:
        enabled: ${BASKET_HISTORICAL_DATA_REQUEST_CONSUMER_ENABLED:false}
        connector: smallrye-kafka
        broadcast: true
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: dead-letter.market-service.${BASKET_HISTORICAL_DATA_REQUEST_TOPIC:basket-historical-data-request}
          value:
            serializer: io.quarkus.kafka.client.serialization.ObjectMapperSerializer
        topic: ${BASKET_HISTORICAL_DATA_REQUEST_TOPIC:market-service.basket-historical-data-request}
        group:
          id: ${BASKET_HISTORICAL_DATA_REQUEST_GROUP_ID:basket-historical-data-request}
        health-enabled: false
        enable:
          auto:
            commit: true
        auto:
          offset:
            reset: ${KAFKA_HISTORICAL_BASKET_DATA_REQUEST_OFFSET_RESET:earliest}
        value:
          serializer: io.quarkus.kafka.client.serialization.ObjectMapperSerializer
