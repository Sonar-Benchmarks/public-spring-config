quarkus:
  log:
    sentry:
      ~: ${SENTRY_ENABLED:true}
      level: ${SENTRY_LOG_LEVEL:WARN}
  swagger-ui:
    enable: true
    always-include: true

  mongodb:
    database: marketDB
    application-name: market-service-${ENVIRONMENT:dev}

  rest-client:
    zerodha-api:
      url: https://api.kite.trade
      scope: javax.inject.Singleton

    binance-api:
      url: https://api.binance.com
      scope: javax.inject.Singleton

