          today:
            seconds: 1800
          one-week:
            seconds: 10800
          one-month:
            seconds: 21600
          six-months:
            seconds: 43200
          one-year:
            seconds: 86400
          three-years:
            seconds: 259200
          five-years:
            seconds: 432000
    schema:
      version:
        current: v1
  ohlcv:
    has-tenant: false
    buffer:
