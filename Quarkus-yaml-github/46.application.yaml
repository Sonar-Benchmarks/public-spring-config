quarkus:
  log:
    sentry:
      ~: ${SENTRY_ENABLED:true}
      level: ${SENTRY_LOG_LEVEL:WARN}

  mongodb:
    database: gameDB
    application-name: game-service-${ENVIRONMENT:dev}

  rest-client:
    mpl:
      url: ${MPL_URL:https://qa-partner.mpl.live}
      scope: javax.inject.Singleton
    user-service:
      uri: ${USER_SERVICE_URI:http://localhost:8080}
      scope: javax.inject.Singleton
    market-service:
      uri: ${MARKET_SERVICE_URI:http://localhost:8015}
      scope: javax.inject.Singleton
    wallet-service:
      uri: ${WALLET_SERVICE_URI:http://localhost:8030}
      scope: javax.inject.Singleton
    social-service:
      uri: ${SOCIAL_SERVICE_URI:http://localhost:8080}
      scope: javax.inject.Singleton


