  reconciliation:
    queue:
      url: ${ENTRY_RECONCILIATION_QUEUE_URL:none}
      wait-time:
        milli-secs: ${ENTRY_RECONCILIATION_QUEUE_WAIT_TIME_MILLI_SECS:1000}
        secs: ${ENTRY_RECONCILIATION_QUEUE_WAIT_TIME_SECS:1}
      batch:
