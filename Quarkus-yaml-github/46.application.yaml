pool:
  leaderboard:
    short-pool:
      epochs: ${POOL_LEADERBOARD_SHORT_POOL_EPOCHS:5}
      duration-threshold:
        seconds: ${POOL_LEADERBOARD_SHORT_POOL_DURATION_THRESHOLD:600}
    long-pool:
      epochs: ${POOL_LEADERBOARD_LONG_POOL_EPOCHS:30}
    cold-start:
      duration-threshold:
        seconds: ${POOL_LEADERBOARD_COLD_START_DURATION_THRESHOLD:600}
  state:
    active:
      lock:
        attempt-duration:
          milli-secs: ${POOL_ACTIVE_STATE_LOCK_ATTEMPT_DURATION_MILLI_SECONDS:5000}
        lease-time:
          milli-secs: ${POOL_ACTIVE_STATE_LOCK_LEASE_TIME_MILLI_SECONDS:15000}
      queue:
        url: ${POOL_ACTIVE_STATE_QUEUE_URL:none}
        wait-time:
          milli-secs: ${POOL_ACTIVE_STATE_QUEUE_WAIT_TIME_MILLI_SECS:1000}
          secs: ${POOL_ACTIVE_STATE_QUEUE_WAIT_TIME_SECS:1}
        batch:
          size: ${POOL_ACTIVE_STATE_QUEUE_BATCH_SIZE:10}
        blocking: ${POOL_ACTIVE_STATE_QUEUE_BLOCKING:false}
        enabled: ${POOL_ACTIVE_STATE_QUEUE_ENABLED:true}
    cancelled:
      lock:
        attempt-duration:
          milli-secs: ${POOL_CANCELLED_STATE_LOCK_ATTEMPT_DURATION_MILLI_SECONDS:5000}
        lease-time:
          milli-secs: ${POOL_CANCELLED_STATE_LOCK_LEASE_TIME_MILLI_SECONDS:15000}
      queue:
        url: ${POOL_CANCELLED_STATE_QUEUE_URL:none}
        wait-time:
          milli-secs: ${POOL_CANCELLED_STATE_QUEUE_WAIT_TIME_MILLI_SECS:1000}
          secs: ${POOL_CANCELLED_STATE_QUEUE_WAIT_TIME_SECS:1}
        batch:
          size: ${POOL_CANCELLED_STATE_QUEUE_BATCH_SIZE:1}
        blocking: ${POOL_CANCELLED_STATE_QUEUE_BLOCKING:false}
        enabled: ${POOL_CANCELLED_STATE_QUEUE_ENABLED:true}
    created:
      lock:
        attempt-duration:
          milli-secs: ${POOL_CREATED_STATE_LOCK_ATTEMPT_DURATION_MILLI_SECONDS:5000}
        lease-time:
          milli-secs: ${POOL_CREATED_STATE_LOCK_LEASE_TIME_MILLI_SECONDS:15000}
      queue:
        url: ${POOL_CREATED_STATE_QUEUE_URL:none}
        wait-time:
          milli-secs: ${POOL_CREATED_STATE_QUEUE_WAIT_TIME_MILLI_SECS:1000}
          secs: ${POOL_CREATED_STATE_QUEUE_WAIT_TIME_SECS:1}
        batch:
          size: ${POOL_CREATED_STATE_QUEUE_BATCH_SIZE:10}
        blocking: ${POOL_CREATED_STATE_QUEUE_BLOCKING:false}
        enabled: ${POOL_CREATED_STATE_QUEUE_ENABLED:true}
    done:
      lock:
        attempt-duration:
          milli-secs: ${POOL_DONE_STATE_LOCK_ATTEMPT_DURATION_MILLI_SECONDS:5000}
        lease-time:
          milli-secs: ${POOL_DONE_STATE_LOCK_LEASE_TIME_MILLI_SECONDS:15000}
      queue:
        url: ${POOL_DONE_STATE_QUEUE_URL:none}
        wait-time:
          milli-secs: ${POOL_DONE_STATE_QUEUE_WAIT_TIME_MILLI_SECS:1000}
          secs: ${POOL_DONE_STATE_QUEUE_WAIT_TIME_SECS:1}
        batch:
          size: ${POOL_DONE_STATE_QUEUE_BATCH_SIZE:1}
        blocking: ${POOL_DONE_STATE_QUEUE_BLOCKING:false}
        enabled: ${POOL_DONE_STATE_QUEUE_ENABLED:true}
    final:
      lock:
        attempt-duration:
          milli-secs: ${POOL_FINAL_STATE_LOCK_ATTEMPT_DURATION_MILLI_SECONDS:5000}
        lease-time:
          milli-secs: ${POOL_FINAL_STATE_LOCK_LEASE_TIME_MILLI_SECONDS:15000}
      queue:
        url: ${POOL_FINAL_STATE_QUEUE_URL:none}
        wait-time:
          milli-secs: ${POOL_FINAL_STATE_QUEUE_WAIT_TIME_MILLI_SECS:1000}
          secs: ${POOL_FINAL_STATE_QUEUE_WAIT_TIME_SECS:1}
        batch:
          size: ${POOL_FINAL_STATE_QUEUE_BATCH_SIZE:1}
        blocking: ${POOL_FINAL_STATE_QUEUE_BLOCKING:true}
        enabled: ${POOL_FINAL_STATE_QUEUE_ENABLED:true}
    live:
      lock:
        attempt-duration:
          milli-secs: ${POOL_LIVE_STATE_LOCK_ATTEMPT_DURATION_MILLI_SECONDS:5000}
        lease-time:
          milli-secs: ${POOL_LIVE_STATE_LOCK_LEASE_TIME_MILLI_SECONDS:15000}
      queue:
        url: ${POOL_LIVE_STATE_QUEUE_URL:none}
        wait-time:
          milli-secs: ${POOL_LIVE_STATE_QUEUE_WAIT_TIME_MILLI_SECS:1000}
          secs: ${POOL_LIVE_STATE_QUEUE_WAIT_TIME_SECS:1}
        batch:
          size: ${POOL_LIVE_STATE_QUEUE_BATCH_SIZE:1}
        blocking: ${POOL_LIVE_STATE_QUEUE_BLOCKING:true}
        enabled: ${POOL_LIVE_STATE_QUEUE_ENABLED:true}
    process-winnings:
      lock:
        attempt-duration:
          milli-secs: ${POOL_PROCESSING_WINNINGS_STATE_LOCK_ATTEMPT_DURATION_MILLI_SECONDS:5000}
        lease-time:
          milli-secs: ${POOL_PROCESSING_WINNINGS_STATE_LOCK_LEASE_TIME_MILLI_SECONDS:15000}
      queue:
        url: ${POOL_PROCESSING_WINNINGS_STATE_QUEUE_URL:none}
        wait-time:
          milli-secs: ${POOL_PROCESSING_WINNINGS_STATE_QUEUE_WAIT_TIME_MILLI_SECS:1000}
          secs: ${POOL_PROCESSING_WINNINGS_STATE_QUEUE_WAIT_TIME_SECS:1}
        batch:
          size: ${POOL_PROCESSING_WINNINGS_STATE_QUEUE_BATCH_SIZE:10}
        blocking: ${POOL_PROCESSING_WINNINGS_STATE_QUEUE_BLOCKING:false}
        enabled: ${POOL_PROCESSING_WINNINGS_STATE_QUEUE_ENABLED:true}
    process-refunds:
      lock:
        attempt-duration:
          milli-secs: ${POOL_PROCESSING_REFUNDS_STATE_LOCK_ATTEMPT_DURATION_MILLI_SECONDS:5000}
        lease-time:
          milli-secs: ${POOL_PROCESSING_REFUNDS_STATE_LOCK_LEASE_TIME_MILLI_SECONDS:15000}
      queue:
        url: ${POOL_PROCESSING_REFUNDS_STATE_QUEUE_URL:none}
        wait-time:
          milli-secs: ${POOL_PROCESSING_REFUNDS_STATE_QUEUE_WAIT_TIME_MILLI_SECS:1000}
          secs: ${POOL_PROCESSING_REFUNDS_STATE_QUEUE_WAIT_TIME_SECS:1}
        batch:
          size: ${POOL_PROCESSING_REFUNDS_STATE_QUEUE_BATCH_SIZE:10}
        blocking: ${POOL_PROCESSING_REFUNDS_STATE_QUEUE_BLOCKING:false}
        enabled: ${POOL_PROCESSING_REFUNDS_STATE_QUEUE_ENABLED:true}
    suspended:
      lock:
        attempt-duration:
          milli-secs: ${POOL_SUSPENDED_STATE_LOCK_ATTEMPT_DURATION_MILLI_SECONDS:5000}
        lease-time:
          milli-secs: ${POOL_SUSPENDED_STATE_LOCK_LEASE_TIME_MILLI_SECONDS:15000}
      queue:
        url: ${POOL_SUSPENDED_STATE_QUEUE_URL:none}
        wait-time:
          milli-secs: ${POOL_SUSPENDED_STATE_QUEUE_WAIT_TIME_MILLI_SECS:1000}
          secs: ${POOL_SUSPENDED_STATE_QUEUE_WAIT_TIME_SECS:1}
        batch:
          size: ${POOL_SUSPENDED_STATE_QUEUE_BATCH_SIZE:10}
        blocking: ${POOL_SUSPENDED_STATE_QUEUE_BLOCKING:false}
        enabled: ${POOL_SUSPENDED_STATE_QUEUE_ENABLED:true}
  cache:
    expiry:
      default:
        milli-seconds: ${POOL_CACHE_EXPIRY_DEFAULT_MILLI_SECONDS:900000}
        seconds: ${POOL_CACHE_EXPIRY_DEFAULT_SECONDS:900}
      upcoming-public-pools:
        milli-seconds: ${POOL_CACHE_EXPIRY_UPCOMING_PUBLIC_POOLS_MILLI_SECONDS:900000}
        seconds: ${POOL_CACHE_EXPIRY_UPCOMING_PUBLIC_POOLS_SECONDS:900}
  template-reconciliation:
    calendar-buffer-windows: ${POOL_TEMPLATE_RECONCILIATION_CALENDAR_BUFFER_WINDOWS:50}
  schema:
    version:
      current: ${POOL_SCHEMA_VERSION_CURRENT:v1}
  format:
    portfolio:
      weightage:
        max: ${POOL_FORMAT_PORTFOLIO_WEIGHTAGE_MAX:97}
        min: ${POOL_FORMAT_PORTFOLIO_WEIGHTAGE_MIN:1}
        total: ${POOL_FORMAT_PORTFOLIO_WEIGHTAGE_TOTAL:100}
      securities:
        max: ${POOL_FORMAT_PORTFOLIO_SECURITIES_MAX:100}
        min: ${POOL_FORMAT_PORTFOLIO_SECURITIES_MIN:4}
    portfolio-boosters:
      booster-weightage:
        default: ${POOL_FORMAT_PORTFOLIO_BOOSTERS_BOOSTER_WEIGHTAGE_DEFAULT:1.0}
        allowed: ${POOL_FORMAT_PORTFOLIO_BOOSTERS_BOOSTER_WEIGHTAGE_ALLOWED:1.0,1.5,2.0}
        non-default:
          count: ${POOL_FORMAT_PORTFOLIO_BOOSTERS_BOOSTER_WEIGHTAGE_NON_DEFAULT_COUNT:1}
        min: ${POOL_FORMAT_PORTFOLIO_BOOSTERS_BOOSTER_MIN:1}
        total: ${POOL_FORMAT_PORTFOLIO_BOOSTERS_BOOSTER_TOTAL:100}
      securities:
        max: ${POOL_FORMAT_PORTFOLIO_BOOSTERS_SECURITIES_MAX:100}
        min: ${POOL_FORMAT_PORTFOLIO_BOOSTERS_SECURITIES_MIN:4}
    picks:
      weightage:
        max: ${POOL_FORMAT_PICKS_WEIGHTAGE_MAX:1}
        min: ${POOL_FORMAT_PICKS_WEIGHTAGE_MIN:1}
      securities:
        max: ${POOL_FORMAT_PICKS_SECURITIES_MAX:100}
        min: ${POOL_FORMAT_PICKS_SECURITIES_MIN:4}
    long-short:
      weightage:
        max: ${POOL_FORMAT_LONG_SHORT_WEIGHTAGE_MAX:1}
        min: ${POOL_FORMAT_LONG_SHORT_WEIGHTAGE_MIN:1}
      securities:
        max: ${POOL_FORMAT_LONG_SHORT_SECURITIES_MAX:100}
        min: ${POOL_FORMAT_LONG_SHORT_SECURITIES_MIN:4}


