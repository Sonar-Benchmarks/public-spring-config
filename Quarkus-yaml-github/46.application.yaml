      blocking: ${ENTRY_RECONCILIATION_QUEUE_BLOCKING:false}
      enabled: ${ENTRY_RECONCILIATION_QUEUE_ENABLED:true}


mpl:
  admin:
    metric:
      user: ${MPL_ADMIN_METRIC_USER:3667329}


framework:
  aws:
    sqs:
      enabled: ${FRAMEWORK_AWS_SQS_ENABLED:false}
  outbox:
    enabled: ${FRAMEWORK_OUTBOX_ENABLED:true}
    serializer: ${FRAMEWORK_OUTBOX_SERIALIZER:confluentAvroSerializer}
    schema:
      registry:
        url: ${FRAMEWORK_OUTBOX_SCHEMA_REGISTRY_URL:http://localhost:8081}


game:
  default:
    channelId: 7c90a37f-6ea6-4b20-a55d-172bee914c1f


kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}


mp:
  messaging:
    connector:
      smallrye-kafka:
        schema:
          registry:
            url: ${FRAMEWORK_OUTBOX_SCHEMA_REGISTRY_URL:http://localhost:29080}

    incoming:
      Pool:
        enabled: ${KAFKA_SCHEDULER_ENABLED:false}
        connector: smallrye-kafka
        broadcast: true
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: dead-letter.game-service.${KAFKA_POOLS_SCHEDULER_GROUP_ID:Pool}
        topic: ${KAFKA_POOLS_TOPIC:game-service.outbox.event.Pool}
        group:
          id: ${KAFKA_POOLS_SCHEDULER_GROUP_ID:Pool}
        health-enabled: false
        enable:
          auto:
            commit: true
        auto:
          offset:
            reset: ${KAFKA_POOLS_OFFSET_RESET:earliest}
          commit:
            interval:
              ms: ${KAFKA_POOLS_AUTO_COMMIT_INTERVAL:5000}

      PoolEntry:
        enabled: ${KAFKA_SCHEDULER_ENABLED:false}
        connector: smallrye-kafka
        broadcast: true
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: dead-letter.game-service.${KAFKA_POOL_ENTRIES_SCHEDULER_GROUP_ID:PoolEntry}
        topic: ${KAFKA_POOL_ENTRIES_TOPIC:game-service.outbox.event.PoolEntry}
        group:
          id: ${KAFKA_POOL_ENTRIES_SCHEDULER_GROUP_ID:PoolEntry}
        health-enabled: false
        enable:
          auto:
            commit: true
        auto:
          offset:
            reset: ${KAFKA_POOL_ENTRIES_OFFSET_RESET:earliest}
          commit:
            interval:
              ms: ${KAFKA_POOL_ENTRIES_AUTO_COMMIT_INTERVAL:5000}
